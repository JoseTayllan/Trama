name: Build and tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Trama.slnx --locked-mode
      - run: dotnet build Trama.slnx --configuration Release --no-restore
      - run: dotnet format Trama.slnx --verify-no-changes --no-restore
      - run: dotnet test Trama.slnx --configuration Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
